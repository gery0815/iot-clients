services:
  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered-data:/data
    depends_on:
      - openccu

  openccu:
    image: ghcr.io/openccu/openccu:latest
    container_name: openccu
    restart: unless-stopped
    privileged: true
    ports:
      - "80:80"
      - "2001:2001"
      - "2010:2010"
      - "8181:8181"
      - "8701:8701"
    volumes:
      - ./openccu-data:/usr/local
    devices:
      - "${OCCU_USB_DEVICE:-/dev/ttyUSB0}:${OCCU_USB_DEVICE:-/dev/ttyUSB0}"
    tty: true
    stdin_open: true