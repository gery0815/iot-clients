services:
  nodered:
    image: ${NODERED_IMAGE:-nodered/node-red:latest}
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - openccu

  openccu:
    image: raspi-client/openccu:latest
    build:
      context: .
      dockerfile: Dockerfile.openccu
    container_name: openccu
    restart: unless-stopped
    privileged: true
    ports:
      - "80:80"
      - "2001:2001"
      - "2010:2010"
      - "8181:8181"
      - "8701:8701"
    volumes:
      - openccu_data:/usr/local
    tty: true
    stdin_open: true

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  nodered_data:
  openccu_data:
  portainer_data: